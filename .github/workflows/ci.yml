name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test

      - name: Build app
        run: yarn build

      - name: Build Storybook
        run: yarn build-storybook

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Reported separately from the build so a newly disclosed advisory in a
      # transitive dev dependency surfaces without masking the build signal.
      - name: Audit dependencies
        run: yarn audit --level high
